version: '3'

dotenv: ['.env']

vars:
  CLUSTER_NAME: claude-gateway-poc
  NAMESPACE: gateway
  LITELLM_IMAGE: ghcr.io/berriai/litellm:v1.102.1
  # presidio-analyzer is an auth-adding proxy to the GLiNER2 analyzer on RunPod.
  ANALYZER_PROXY_IMAGE: nginxinc/nginx-unprivileged:1.29-alpine
  PRESIDIO_ANONYMIZER_IMAGE: mcr.microsoft.com/presidio-anonymizer:latest
  LITELLM_HTTP_URL: http://litellm.local:8080
  LITELLM_HTTPS_URL: https://litellm.local:8443
  CILIUM_VERSION: "1.16.5"

# ─────────────────────────────────────────────────────────────────
# Supply chain tasks
# ─────────────────────────────────────────────────────────────────

tasks:
  pin-images:
    desc: Pull container images and pin their SHA-256 digests in manifests (run once, commit the diff)
    cmds:
      - |
        set -euo pipefail
        pin() {
          local tag="$1" manifest="$2"
          echo "→ Pulling $tag ..."
          docker pull "$tag" > /dev/null 2>&1
          local repo_digest
          repo_digest=$(docker inspect --format='{{"{{"}}index .RepoDigests 0{{"}}"}}' "$tag" 2>/dev/null || true)
          if [ -z "$repo_digest" ]; then
            echo "ERROR: no RepoDigest for $tag — image may not be in a registry. Cannot pin." >&2
            exit 1
          fi
          local digest
          digest=$(echo "$repo_digest" | awk -F'@' '{print $2}')
          local pinned="${tag}@${digest}"
          # Replace both already-pinned and un-pinned forms
          sed -i.bak \
            -e "s|image: ${tag}@sha256:[a-f0-9]*|image: ${pinned}|g" \
            -e "s|image: ${tag}$|image: ${pinned}|g" \
            "$manifest"
          rm -f "${manifest}.bak"
          echo "  ✓ ${pinned}"
        }
        pin "{{.LITELLM_IMAGE}}"             manifests/22-litellm.yaml
        pin "{{.ANALYZER_PROXY_IMAGE}}"   manifests/10-presidio-analyzer.yaml
        pin "{{.PRESIDIO_ANONYMIZER_IMAGE}}"  manifests/11-presidio-anonymizer.yaml
        echo ""
        echo "Digests pinned. Review 'git diff manifests/' before committing."

  verify-images:
    desc: Re-pull images and verify SHA-256 digests match manifests; fails hard if not pinned
    cmds:
      - |
        set -euo pipefail
        FAIL=0

        check_pinned() {
          local tag="$1" manifest="$2"
          if ! grep -qE "image: ${tag}@sha256:[a-f0-9]+" "$manifest"; then
            echo "✗ DIGEST_NOT_PINNED: $tag in $manifest" >&2
            echo "  → Run: task pin-images" >&2
            FAIL=1
          fi
        }

        check_pinned "{{.LITELLM_IMAGE}}"             manifests/22-litellm.yaml
        check_pinned "{{.ANALYZER_PROXY_IMAGE}}"   manifests/10-presidio-analyzer.yaml
        check_pinned "{{.PRESIDIO_ANONYMIZER_IMAGE}}"  manifests/11-presidio-anonymizer.yaml

        [ "$FAIL" = "0" ] || exit 1

        echo "Verifying image digests against registry..."

        verify() {
          local tag="$1" manifest="$2"
          local pinned_ref
          pinned_ref=$(grep -E "image: ${tag}@sha256:" "$manifest" | awk '{print $2}')
          local pinned_digest="${pinned_ref##*@sha256:}"

          docker pull "$tag" > /dev/null 2>&1
          local current_repo_digest
          current_repo_digest=$(docker inspect --format='{{"{{"}}index .RepoDigests 0{{"}}"}}' "$tag" 2>/dev/null || true)
          local current_digest="${current_repo_digest##*@sha256:}"

          if [ "$pinned_digest" = "$current_digest" ]; then
            echo "  ✓ $tag — digest matches (sha256:${pinned_digest:0:12}...)"
          else
            echo "  ✗ $tag — DIGEST MISMATCH" >&2
            echo "    manifest : sha256:${pinned_digest}" >&2
            echo "    registry : sha256:${current_digest}" >&2
            echo "    The image on the registry has changed. Review before re-pinning." >&2
            FAIL=1
          fi
        }

        verify "{{.LITELLM_IMAGE}}"             manifests/22-litellm.yaml
        verify "{{.ANALYZER_PROXY_IMAGE}}"   manifests/10-presidio-analyzer.yaml
        verify "{{.PRESIDIO_ANONYMIZER_IMAGE}}"  manifests/11-presidio-anonymizer.yaml

        [ "$FAIL" = "0" ] || exit 1
        echo "All image digests verified."

# ─────────────────────────────────────────────────────────────────
# Cluster lifecycle
# ─────────────────────────────────────────────────────────────────

  up:
    desc: Create K3D cluster (idempotent), apply manifests, wait for pods to be Ready
    deps: [verify-images]
    cmds:
      - |
        set -euo pipefail

        if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
          echo "ERROR: ANTHROPIC_API_KEY is not set." >&2
          echo "  Copy .env.example to .env and fill in both keys." >&2
          exit 1
        fi

        if [ -z "${LITELLM_MASTER_KEY:-}" ]; then
          echo "ERROR: LITELLM_MASTER_KEY is not set." >&2
          echo "  Copy .env.example to .env and fill in both keys." >&2
          exit 1
        fi

        if [ -z "${RUNPOD_API_KEY:-}" ] || [ -z "${RUNPOD_ENDPOINT_ID:-}" ]; then
          echo "ERROR: RUNPOD_API_KEY and RUNPOD_ENDPOINT_ID must be set in .env." >&2
          echo "  The Presidio analyzer (GLiNER2) runs on RunPod — see README 'PII detection: GLiNER2 on a RunPod GPU'." >&2
          exit 1
        fi

        # Create cluster if it doesn't already exist
        if k3d cluster list --no-headers 2>/dev/null | grep -q "{{.CLUSTER_NAME}}"; then
          echo "Cluster '{{.CLUSTER_NAME}}' already exists — skipping creation."
          if ! helm status cilium -n kube-system > /dev/null 2>&1; then
            echo "ERROR: cluster exists but Cilium is not installed." >&2
            echo "  The cluster was created before Cilium support was added." >&2
            echo "  Run: task clean && task up" >&2
            exit 1
          fi
        else
          echo "Creating K3D cluster '{{.CLUSTER_NAME}}' ..."
          k3d cluster create --config k3d/cluster.yaml
          echo "Cluster created."
        fi

        # Point kubectl at the new cluster
        k3d kubeconfig merge "{{.CLUSTER_NAME}}" --kubeconfig-switch-context > /dev/null

        # Install / upgrade Cilium CNI (must run before any workload pods are scheduled)
        echo "Installing Cilium CNI {{.CILIUM_VERSION}}..."
        helm repo add cilium https://helm.cilium.io/ 2>/dev/null || true
        # Traefik is reached through hostPort 80/443; without kube-proxy replacement, Cilium only
        # implements hostPort with nodePort+hostPort enabled (flannel's portmap is gone).
        helm upgrade --install cilium cilium/cilium \
          --version "{{.CILIUM_VERSION}}" \
          --namespace kube-system \
          --set operator.replicas=1 \
          --set kubeProxyReplacement=false \
          --set nodePort.enabled=true \
          --set hostPort.enabled=true \
          --set rollOutCiliumPods=true \
          --set dnsProxy.enableTransparentMode=false \
          --wait --timeout=180s
        echo "Cilium ready."

        # Apply manifests in order
        echo "Applying manifests..."
        kubectl apply -f manifests/00-namespace.yaml

        # Install cert-manager (required for TLS)
        echo "Installing cert-manager..."
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml
        echo "Waiting for cert-manager to be ready..."
        kubectl rollout status deployment/cert-manager -n cert-manager --timeout=120s 2>/dev/null || true
        kubectl rollout status deployment/cert-manager-webhook -n cert-manager --timeout=120s 2>/dev/null || true
        sleep 3 # Give issuers time to settle

        # Create secret directly — no envsubst required
        kubectl create secret generic litellm-secrets \
          -n "{{.NAMESPACE}}" \
          --from-literal=ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
          --from-literal=LITELLM_MASTER_KEY="${LITELLM_MASTER_KEY}" \
          --save-config \
          --dry-run=client -o yaml | kubectl apply -f -

        # Separate secret: only the analyzer proxy needs the RunPod key; LiteLLM never sees it.
        kubectl create secret generic runpod-analyzer \
          -n "{{.NAMESPACE}}" \
          --from-literal=RUNPOD_API_KEY="${RUNPOD_API_KEY}" \
          --from-literal=RUNPOD_ENDPOINT_ID="${RUNPOD_ENDPOINT_ID}" \
          --save-config \
          --dry-run=client -o yaml | kubectl apply -f -

        # Configure Traefik to bind ports 80/443 on the node (enables k3d host port mapping)
        kubectl apply -f manifests/15-traefik-config.yaml
        echo "Waiting for Traefik to apply new config..."
        kubectl rollout status deployment/traefik -n kube-system --timeout=90s 2>/dev/null || true

        kubectl apply -f manifests/21-litellm-config.yaml
        # The guardrail code the proxy runs, as a manifest rather than an imperative
        # `kubectl create configmap --from-file`. That form has no manifest, so neither
        # `kubectl diff` nor git can see it, and a stale copy ships silently.
        # Both files render into the same ConfigMap, so code_guard.py and the
        # leak_guard_hook.py that imports from it can never go out of step.
        python3 scripts/render_placeholders.py manifests/23-litellm-guardrails.yaml | kubectl apply -f -
        kubectl apply -f manifests/10-presidio-analyzer.yaml
        kubectl apply -f manifests/11-presidio-anonymizer.yaml
        kubectl apply -f manifests/22-litellm.yaml
        kubectl apply -f manifests/25-certificate-issuer.yaml
        kubectl apply -f manifests/26-litellm-ingress.yaml
        kubectl apply -f manifests/30-postgres.yaml
        kubectl apply -f manifests/40-litellm-netpol.yaml

        # Wait for deployments.
        # First run pulls images inside k3d's own containerd (not host Docker cache).
        # Presidio Analyzer is ~1GB; allow 5 minutes for cold-pull on first run.
        # Subsequent task up (after task down) is fast — images are cached inside the cluster.
        echo "Waiting for deployments to become ready (timeout 300s — first run may pull images)..."
        kubectl rollout status deployment/presidio-analyzer  -n "{{.NAMESPACE}}" --timeout=300s
        kubectl rollout status deployment/presidio-anonymizer -n "{{.NAMESPACE}}" --timeout=300s
        kubectl rollout status deployment/litellm             -n "{{.NAMESPACE}}" --timeout=300s

        # Wait for certificate to be issued
        echo "Waiting for TLS certificate to be issued..."
        kubectl wait --for=condition=ready certificate/litellm-tls -n "{{.NAMESPACE}}" --timeout=60s 2>/dev/null || echo "⚠ Certificate may still be issuing"

        echo ""
        echo "✓ Gateway stack is ready."
        echo "  HTTP:  {{.LITELLM_HTTP_URL}}"
        echo "  HTTPS: {{.LITELLM_HTTPS_URL}} (self-signed cert, use -k)"

  down:
    desc: Stop the K3D cluster (preserves state)
    cmds:
      - k3d cluster stop "{{.CLUSTER_NAME}}"

  clean:
    desc: Delete the K3D cluster entirely
    cmds:
      - |
        k3d cluster delete "{{.CLUSTER_NAME}}" && echo "✓ Cluster deleted."

# ─────────────────────────────────────────────────────────────────
# Operations
# ─────────────────────────────────────────────────────────────────

  status:
    desc: Pod status + last 20 log lines + LiteLLM health check via ingress
    cmds:
      - |
        set -euo pipefail
        echo "=== Pods ==="
        kubectl get pods -n "{{.NAMESPACE}}" -o wide
        echo ""
        echo "=== LiteLLM logs (last 20 lines) ==="
        kubectl logs -n "{{.NAMESPACE}}" -l app=litellm --tail=20 2>/dev/null || echo "(no logs yet)"
        echo ""
        echo "=== LiteLLM /health (via ingress) ==="
        curl -sf "{{.LITELLM_HTTP_URL}}/health/liveliness" | (command -v jq &>/dev/null && jq . || cat) || echo "(health check failed — is the ingress up?)"

  logs:
    desc: Follow LiteLLM logs
    cmds:
      - kubectl logs -n "{{.NAMESPACE}}" -l app=litellm -f

  verify:
    desc: Every check that the running cluster matches the repo (needs a live cluster)
    cmds:
      - |
        set -uo pipefail
        # Three hops, three checks, and the pair that were skipped are the ones that hid a
        # real defect — a ConfigMap apply leaves the running pod on the old bytes, and
        # nothing anywhere says so:
        #   config-drift          manifest   -> ConfigMap
        #   verify-mounted-bytes  ConfigMap  -> the file the container is executing
        #   check-guardrails      the file imports, and is a CustomGuardrail so its hooks fire
        # Run separately, none of them tells you it was skipped, and a check nobody runs is
        # indistinguishable from a check that passes.
        #
        # verify-netpol is deliberately NOT here. It is a behavioural test of the network
        # policy rather than a repo-vs-cluster comparison, and it is currently red for the
        # intended state: it expects LiteLLM to reach presidio-analyzer, which is scaled
        # to 0 on purpose. Folding a permanently-failing check in here would mean `verify`
        # is always red, and an always-red signal is not read.
        FAIL=0
        for target in config-drift verify-mounted-bytes check-guardrails; do
          echo "=== $target ==="
          # -s so the sub-task's command is not echoed above its own output. Each target
          # already reports its own verdict, so only the failure line is added here.
          if ! task -s "$target"; then
            echo "✗ $target"
            FAIL=1
          fi
          echo ""
        done
        if [ "$FAIL" -ne 0 ]; then
          echo "✗ cluster does not match the repo — see the failures above"
          exit 1
        fi
        echo "✓ cluster matches the repo on all three hops"

  test:
    desc: Run the offline test suite (no cluster, no GPU)
    cmds:
      - |
        set -uo pipefail
        # go-task puts a CLI variable in the template scope but NOT in the command's
        # environment, so `task test PYTHON=/x` silently fell back to python3 — and
        # python3 on a PEP-668 system has no pyyaml, so the suite failed on a missing
        # dependency instead of running. The template reads the CLI form, the shell
        # fallback reads the environment form, and both spellings now work.
        PY="{{if .PYTHON}}{{.PYTHON}}{{end}}"
        PY="${PY:-python3}"
        FAIL=0
        # Manifest wiring is checked here, not only in the cluster: a subPath with no
        # ConfigMap key, or a pasted-in copy of a guardrail file, is a silent failure
        # that would otherwise surface as a pod stuck in ContainerCreating.
        for t in scripts/test_suite_wiring.py \
                 scripts/test_manifest_consistency.py \
                 scripts/test_render_placeholders.py \
                 scripts/test_fake_mcp_server.py \
                 scripts/test_e2e_export_mcp.py \
                 guardrail/test_code_guard.py \
                 guardrail/test_leak_guard.py \
                 guardrail/test_leak_guard_hook.py \
                 guardrail/test_mock_presidio.py; do
          if out=$("$PY" "$t" 2>&1); then
            printf '  ok    %s\n' "$t"
          else
            printf '  FAIL  %s\n%s\n' "$t" "$out"
            FAIL=1
          fi
        done
        # A separate script, and a different pass/fail shape from unittest.
        if out=$("$PY" guardrail/test_integration.py 2>&1); then
          printf '  ok    %s\n' "guardrail/test_integration.py"
        else
          printf '  FAIL  %s\n%s\n' "guardrail/test_integration.py" "$out"
          FAIL=1
        fi
        if [ "$FAIL" -ne 0 ]; then
          echo ""
          echo "✗ offline suite failed"
          exit 1
        fi
        echo "✓ offline suite passed"

  e2e:
    desc: "E2E: Claude Code exports customers_leaked via sqlite3 (Bash) — needs the cluster"
    cmds:
      - |
        PY="{{if .PYTHON}}{{.PYTHON}}{{end}}"
        PY="${PY:-python3}"
        "$PY" scripts/e2e_export.py

  e2e-mcp:
    desc: >-
      E2E: an MCP server returns customers_leaked in 3 formats — needs the cluster.
      SCENARIO=customers-nested serves the rows one level down, which is the fixture for
      pii-guardian-64g. It was expected to FAIL while LeakGuard read only the top level of
      a JSON document; it is a regression guard now.
    cmds:
      - |
        PY="{{if .PYTHON}}{{.PYTHON}}{{end}}"
        PY="${PY:-python3}"
        if [ -n "{{.SCENARIO}}" ]; then
          exec "$PY" scripts/e2e_export_mcp.py --scenario "{{.SCENARIO}}"
        fi
        exec "$PY" scripts/e2e_export_mcp.py

  config-drift:
    desc: Report any manifest that differs from what the cluster is actually running
    cmds:
      - |
        set -uo pipefail
        # `kubectl diff` is a server-side dry-run apply: exit 0 means the live object
        # already matches the manifest, 1 means it would change something. Reading drift
        # off this is the point — a ConfigMap edited in the cluster, or an older manifest
        # left applied, produces no error anywhere else.
        #
        # Placeholders are always rendered first, so a guardrail file edited in the repo
        # shows up here as drift rather than waiting for the next apply to disagree.
        # No -n here: each object carries its own namespace, and 15-traefik-config.yaml
        # is deliberately in kube-system. Forcing one namespace makes it a false DRIFT.
        DRIFT=0
        for m in manifests/*.yaml; do
          if out=$(python3 scripts/render_placeholders.py -q "$m" | kubectl diff -f - 2>&1); then
            printf '  ok    %s\n' "$m"
          else
            printf '  DRIFT %s\n%s\n' "$m" "$out"
            DRIFT=1
          fi
        done
        if [ "$DRIFT" -ne 0 ]; then
          echo ""
          echo "✗ cluster does not match manifests/ — run 'task reload-config' (or 'task up')"
          exit 1
        fi
        echo "✓ cluster matches manifests/"

  reload-config:
    desc: Re-apply LiteLLM config and rolling-restart the deployment
    cmds:
      - |
        set -euo pipefail
        kubectl apply -f manifests/21-litellm-config.yaml
        # Both guardrail ConfigMaps in one render, always. leak_guard_hook.py imports
        # data_targets() from code_guard.py, so a half-applied pair leaves the proxy
        # unable to import LeakGuardHook at all — an import error here takes the whole
        # gateway down, not just this guardrail.
        python3 scripts/render_placeholders.py manifests/23-litellm-guardrails.yaml | kubectl apply -f -
        # The Deployment too, not just the ConfigMaps. Config here is split across both
        # files — the guardrails' mounts in 22, the config.yaml in 21 — so applying only
        # the ConfigMaps left the pod running a spec the repo no longer described, and
        # `task config-drift` was the only thing that noticed. This is what makes that
        # target's "run task reload-config" advice true for every file it checks.
        kubectl apply -f manifests/22-litellm.yaml
        # Then restart unconditionally, because apply alone is not enough.
        #
        # The guardrail files are mounted with subPath, and a subPath mount is written
        # once when the container starts and never refreshed: Kubernetes does not update
        # it when the ConfigMap changes. So a ConfigMap apply leaves the running pod
        # executing the old bytes, with no error and no event to explain it. Observed
        # directly — repo and ConfigMap both at sha 1a97cf45 with the fix, the pod still
        # at bd4d0556 without it, so the fix looked applied and did nothing.
        #
        # A rollout restart is therefore the only thing that delivers a ConfigMap change,
        # and it has to be unconditional: an unchanged Deployment spec makes `apply` a
        # no-op that creates no new pod, so relying on the apply to restart is how the
        # stale-file case gets in.
        kubectl rollout restart deployment/litellm -n "{{.NAMESPACE}}"
        kubectl rollout status deployment/litellm -n "{{.NAMESPACE}}" --timeout=180s
        echo "✓ Config reloaded — gateway still reachable at {{.LITELLM_HTTP_URL}}"

  verify-mounted-bytes:
    desc: Assert the running pod's guardrail files match the ConfigMaps, byte for byte
    cmds:
      - python3 scripts/verify_mounted_bytes.py -n "{{.NAMESPACE}}"

  check-guardrails:
    desc: Import every guardrail the config names, without restarting the proxy
    cmds:
      - |
        set -euo pipefail
        # A guardrail that fails to import does not degrade — LiteLLM raises during startup
        # and the whole gateway CrashLoopBackOffs, taking healthy guardrails down with it.
        # This makes the failure a one-line report instead of an outage.
        # NOTE: a guardrail that imports but is not a CustomGuardrail subclass is NOT caught
        # here; LiteLLM loads it happily and its hooks simply never fire. The assertion below
        # covers that case too.
        kubectl exec -i -n "{{.NAMESPACE}}" deploy/litellm -- python3 - <<'PY'
        import hashlib, importlib, sys, yaml
        from litellm.integrations.custom_guardrail import CustomGuardrail

        # The bytes the pod is actually executing, versus the bytes the ConfigMap holds.
        # A subPath mount is written once at container start and never refreshed, so a
        # ConfigMap apply does not reach the running pod. That gap is invisible from
        # outside — imports still succeed, the guardrail is still registered, and the
        # old code just quietly keeps running.
        #
        # The pod has no kubectl and the repo is not mounted, so the comparison needs the
        # ConfigMap contents from outside. `task verify-mounted-bytes` does that and is
        # the check that matters; here we only assert the mount is readable, which is
        # cheap and still catches a mount that resolved to nothing.
        bad = 0
        import glob
        for mount in sorted(glob.glob("/app/*.py")):
            name = mount.rsplit("/", 1)[-1]
            try:
                if not open(mount).read().strip():
                    print(f"FAIL empty     {name}: mounted but zero bytes")
                    bad += 1
            except Exception as e:
                print(f"FAIL unmounted {name}: {type(e).__name__}: {e}")
                bad += 1

        cfg = yaml.safe_load(open("/app/config.yaml"))
        for g in cfg.get("guardrails", []):
            path = g.get("litellm_params", {}).get("guardrail", "")
            if "." not in path:
                continue  # a built-in, not one of ours
            mod, _, cls = path.rpartition(".")
            try:
                obj = getattr(importlib.import_module(mod), cls)
            except Exception as e:
                print(f"FAIL import  {path}: {type(e).__name__}: {e}"); bad += 1; continue
            if not (isinstance(obj, type) and issubclass(obj, CustomGuardrail)):
                print(f"FAIL subclass {path}: not a CustomGuardrail — its hooks would never fire")
                bad += 1; continue
            print(f"ok   {path}")
        sys.exit(1 if bad else 0)
        PY
        echo "✓ every configured guardrail imports and is a CustomGuardrail"

  verify-netpol:
    desc: Verify CiliumNetworkPolicy — allowed traffic passes, blocked traffic is dropped
    cmds:
      - |
        set -euo pipefail
        FAIL=0

        # TCP probe executed inside the litellm pod (Python always available in the image)
        conn() {
          kubectl exec -n "{{.NAMESPACE}}" deploy/litellm -- \
            python3 -c \
            "import socket,sys;socket.create_connection((sys.argv[1],int(sys.argv[2])),timeout=4).close()" \
            "$1" "$2" 2>/dev/null
        }

        echo ""
        echo "=== CiliumNetworkPolicy — LiteLLM egress verification ==="
        echo ""
        echo "Allowed (must connect):"
        conn presidio-analyzer.gateway.svc.cluster.local  3000 && echo "  ✓ ALLOWED  presidio-analyzer:3000   (internal)"  || { echo "  ✗ ALLOWED  presidio-analyzer:3000 — unexpectedly blocked";   FAIL=1; }
        conn presidio-anonymizer.gateway.svc.cluster.local 3000 && echo "  ✓ ALLOWED  presidio-anonymizer:3000 (internal)"  || { echo "  ✗ ALLOWED  presidio-anonymizer:3000 — unexpectedly blocked"; FAIL=1; }
        conn postgres.gateway.svc.cluster.local            5432 && echo "  ✓ ALLOWED  postgres:5432            (internal)"  || { echo "  ✗ ALLOWED  postgres:5432 — unexpectedly blocked";            FAIL=1; }
        conn api.anthropic.com                              443  && echo "  ✓ ALLOWED  api.anthropic.com:443    (external HTTPS)" || { echo "  ✗ ALLOWED  api.anthropic.com:443 — unexpectedly blocked"; FAIL=1; }

        echo ""
        echo "Blocked (must NOT connect, 4s timeout each):"
        conn api.anthropic.com  80  && { echo "  ✗ BLOCKED  api.anthropic.com:80  — leaked!"; FAIL=1; } || echo "  ✓ BLOCKED  api.anthropic.com:80  (HTTP blocked, HTTPS-only policy)"
        conn www.google.com     443 && { echo "  ✗ BLOCKED  www.google.com:443    — production note: toFQDNs would restrict this"; } || echo "  ✓ BLOCKED  www.google.com:443    (unreachable — expected in k3d without route)"
        conn 1.1.1.1            80  && { echo "  ✗ BLOCKED  1.1.1.1:80            — leaked!"; FAIL=1; } || echo "  ✓ BLOCKED  1.1.1.1:80            (non-HTTPS external blocked)"

        echo ""
        if [ "$FAIL" = "0" ]; then
          echo "✓ All checks passed — CiliumNetworkPolicy is enforcing correctly."
        else
          echo "✗ Some checks failed — review policy or Cilium installation."
          exit 1
        fi

# ─────────────────────────────────────────────────────────────────
# Demo
# ─────────────────────────────────────────────────────────────────

  demo:
    desc: Run the full PII-Guardian demo — MASK, AUDIT, and CARD scenarios
    cmds:
      - |
        set -euo pipefail

        # ── Prerequisites check ──────────────────────────────────
        if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
          echo "ERROR: ANTHROPIC_API_KEY is not set." >&2
          echo "  Copy .env.example to .env and set your key." >&2
          exit 1
        fi

        if ! command -v claude &>/dev/null; then
          echo "ERROR: 'claude' CLI not found in PATH." >&2
          echo "  Install Claude Code: https://claude.ai/download" >&2
          exit 1
        fi

        # ── Bring the stack up (idempotent) ─────────────────────
        task up

        # ── Wait for LiteLLM health via ingress ──────────────────
        echo "Waiting for LiteLLM to be reachable via ingress (up to 60s)..."
        HEALTHY=0
        for i in $(seq 1 30); do
          if curl -sf "{{.LITELLM_HTTP_URL}}/health/liveliness" > /dev/null 2>&1; then
            HEALTHY=1
            break
          fi
          sleep 2
        done

        if [ "$HEALTHY" = "0" ]; then
          echo "ERROR: LiteLLM did not become healthy within 60s." >&2
          echo "  Run: task logs" >&2
          exit 1
        fi

        echo "✓ LiteLLM is healthy."
        echo ""

        # ── Setup banner ─────────────────────────────────────────
        echo "┌─────────────────────────────────────────────────────────┐"
        echo "│  PII-GUARDIAN DEMO                                      │"
        echo "│                                                         │"
        echo "│  Claude Code is routing through the local gateway.      │"
        echo "│  Export these in another shell to test manually:        │"
        echo "│                                                         │"
        echo "│    export ANTHROPIC_BASE_URL={{.LITELLM_HTTP_URL}}      │"
        echo "│    export ANTHROPIC_AUTH_TOKEN=${LITELLM_MASTER_KEY}        │"
        echo "└─────────────────────────────────────────────────────────┘"
        echo ""

        # ── Scenario 1: MASK ─────────────────────────────────────
        bash demo/scenario-mask.sh

        read -rn1 -p "Press any key for Scenario 2 (AUDIT)..." _
        echo ""

        # ── Scenario 2: AUDIT ────────────────────────────────────
        bash demo/scenario-audit.sh

        read -rn1 -p "Press any key for Scenario 3 (CARD)..." _
        echo ""

        # ── Scenario 3: CARD ─────────────────────────────────────
        bash demo/scenario-card.sh

        # ── Final banner ─────────────────────────────────────────
        echo ""
        echo "╔══════════════════════════════════════════════════════════╗"
        echo "║  Demo complete.                                         ║"
        echo "║  Run 'task logs' for the full audit trail.             ║"
        echo "╚══════════════════════════════════════════════════════════╝"
        echo ""

# ─────────────────────────────────────────────────────────────────
# PII detection scoring
# ─────────────────────────────────────────────────────────────────

  pii-score:
    desc: Export the 50-row fictional customers table (French open data) as CSV, Markdown and minified JSON, and report what the gateway masks per format and column
    cmds:
      - |
        set -euo pipefail

        # ── Prerequisites check ──────────────────────────────────
        for bin in sqlite3 jq python3; do
          if ! command -v "$bin" &>/dev/null; then
            echo "ERROR: '$bin' not found in PATH." >&2
            exit 1
          fi
        done

        # ── Bring the stack up (idempotent) ─────────────────────
        task up

        bash scripts/pii-score/run.sh

  pii-bench:
    desc: Benchmark Presidio NER backends (spaCy, GLiNER, GLiNER2) on PERSON/LOCATION in generated source files (FR/EN/ES/IT)
    cmds:
      - |
        set -euo pipefail
        for bin in docker sqlite3 jq python3; do
          if ! command -v "$bin" &>/dev/null; then
            echo "ERROR: '$bin' not found in PATH." >&2
            exit 1
          fi
        done
        bash scripts/pii-score/bench.sh

  pii-bench-gateway:
    desc: End-to-end GLiNER2 benchmark through the running gateway (LiteLLM → proxy → RunPod); per-file masked/not-masked report
    cmds:
      - bash scripts/pii-score/bench-gateway.sh
