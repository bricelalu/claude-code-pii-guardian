apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          # DIGEST_NOT_PINNED — run: task pin-images
          # Supply chain: ONLY use ghcr.io/berriai/litellm. NEVER pip install litellm.
          # See README §Supply Chain — LiteLLM PyPI 1.82.7 and 1.82.8 contained credential-stealing malware.
          image: ghcr.io/berriai/litellm:v1.102.1@sha256:87f34979b9f8cb274fac90ca8a4fdda07d8480de22755562a26adeb95ce20d02
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
            - "--detailed_debug"
          ports:
            - containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
            # Required per README §6.4. Without it the pod has no Anthropic
            # credential, so "Proxy Mode" (client sends only the master key)
            # reaches Anthropic with no x-api-key and is rejected.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: ANTHROPIC_API_KEY
            # Points at mock-presidio, not presidio-analyzer: the real analyzer is scaled
            # to 0 (see manifests/60-mock-presidio.yaml). code_guard.py fails closed on a
            # non-200 from here, so pointing this back at the scaled-down analyzer does not
            # degrade gracefully — it hangs until the 120s analyzer timeout on every
            # pre_call and then fails the request.
            - name: PRESIDIO_ANALYZER_API_BASE
              value: "http://mock-presidio.gateway.svc.cluster.local:3000"
            - name: PRESIDIO_ANONYMIZER_API_BASE
              value: "http://presidio-anonymizer.gateway.svc.cluster.local:3000"
            # LiteLLM truncates long strings before persisting them, replacing the
            # middle with "...(litellm_truncated skipped N chars...)" plus an advisory.
            # The default limit is small enough to hit on any real export, and the result
            # is not a shorter copy of the body — it is a *corrupt* one, so the stored
            # JSON no longer parses and the recorded value cannot be compared to anything.
            #
            # That matters because this column is the audit trail: scripts/e2e_export.py
            # reads it to prove what the guardrails sent upstream. Truncated, it would
            # "pass" by never containing the values being searched for — the worst kind of
            # green. Raised well above any plausible body so the record stays faithful.
            - name: MAX_STRING_LENGTH_PROMPT_IN_DB
              value: "10000000"
            - name: LITELLM_LOG
              value: "DEBUG"
            # LITELLM_RUST routes native Anthropic /v1/messages through the
            # bundled Rust bridge. DISABLED: the bridge was broken for the
            # anthropic provider in v1.100.1 — it ignored the api_key it was
            # handed, so every call 401s. Verified in-pod: a real key and a
            # garbage key both returned the identical
            # "authentication_error: API key is invalid", while the Python path
            # with that same key succeeded.
            # It also never engaged on the proxy route (no x-litellm-rust
            # response header, no bridge log lines, and no latency difference
            # when toggled), so enabling it bought nothing and left every
            # Anthropic request one upstream behaviour change away from
            # failing. Not re-verified against v1.102.1 (nothing in the
            # v1.101.0/v1.102.x release notes mentions the Rust bridge or
            # Anthropic credential forwarding) — re-test before re-enabling.
            # - name: LITELLM_RUST
            #   value: "1"
            - name: DATABASE_URL
              value: "postgresql://litellm:litellm-poc@postgres.gateway.svc.cluster.local:5432/litellm"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: guardrail
              mountPath: /app/code_guard.py
              subPath: code_guard.py
            # LeakGuard engine, and the CustomGuardrail adapter LiteLLM actually loads.
            # leak_guard_hook.py imports data_targets() from code_guard.py, so the two
            # configmaps below have to stay in step (see Taskfile reload-config).
            - name: leak-guard
              mountPath: /app/leak_guard.py
              subPath: leak_guard.py
            - name: leak-guard
              mountPath: /app/leak_guard_hook.py
              subPath: leak_guard_hook.py
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 4
      volumes:
        - name: config
          configMap:
            name: litellm-config
        # Created from guardrail/code_guard.py by `task up` / `task reload-config`.
        - name: guardrail
          configMap:
            name: litellm-guardrail
        # Created from guardrail/leak_guard.py + leak_guard_hook.py by the same targets.
        - name: leak-guard
          configMap:
            name: litellm-leak-guard
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: gateway
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
