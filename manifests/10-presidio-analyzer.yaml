# presidio-analyzer: an auth-adding proxy in front of the GLiNER2 analyzer running on a
# RunPod load-balancing endpoint (GPU, EU data centers, scale-to-zero).
# LiteLLM's Presidio guardrail can't send an Authorization header, so this proxy adds
# RunPod's bearer key. Same Service name, label and port as before, so LiteLLM's
# PRESIDIO_ANALYZER_API_BASE and the CiliumNetworkPolicy are unchanged.
# The previous in-cluster spaCy analyzer is in git history (see docs/ner-model-benchmark.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: presidio-analyzer-proxy
  namespace: gateway
data:
  # Rendered at startup by the nginx image's envsubst step (templates -> conf.d).
  default.conf.template: |
    # IPv4 only: RunPod publishes AAAA records but the cluster has no IPv6 egress.
    resolver kube-dns.kube-system.svc.cluster.local ipv6=off valid=300s;

    # Pooled TLS connections to RunPod: without keepalive every /analyze paid a new TCP + TLS
    # handshake to the EU data center. "resolve" re-resolves the name while running (nginx >= 1.27.3).
    upstream runpod {
        zone runpod 64k;
        server ${RUNPOD_ENDPOINT_ID}.api.runpod.ai:443 resolve;
        keepalive 8;
        keepalive_timeout 120s;
    }

    server {
        listen 3000;

        # Answered locally: probes must never wake (and bill) a RunPod GPU worker.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /analyze {
            proxy_pass https://runpod/analyze;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host ${RUNPOD_ENDPOINT_ID}.api.runpod.ai;
            proxy_set_header Authorization "Bearer ${RUNPOD_API_KEY}";
            proxy_ssl_name ${RUNPOD_ENDPOINT_ID}.api.runpod.ai;
            proxy_ssl_session_reuse on;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_connect_timeout 10s;
            # Cold start (image pull + model load) can take minutes; LiteLLM waits up to 300 s.
            proxy_read_timeout 300s;
            client_max_body_size 30m;
        }

        location / {
            return 404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-analyzer
  namespace: gateway
spec:
  # Scaled to 0 on purpose. The real analyzer is GLiNER2 on a RunPod GPU worker; when
  # that worker is cold or absent, code_guard's _analyze blocks for its full 120s timeout
  # and then fails closed, so the whole gateway hangs behind it. Something has to answer
  # /analyze, and mock-presidio (60-mock-presidio.yaml) is what does here.
  #
  # To use the real thing again: set this back to 1, wait for it, and point
  # PRESIDIO_ANALYZER_API_BASE in 22-litellm.yaml at presidio-analyzer instead of
  # mock-presidio. The netpol in 40-litellm-netpol.yaml has to allowlist it too.
  replicas: 0
  selector:
    matchLabels:
      app: presidio-analyzer
  template:
    metadata:
      labels:
        app: presidio-analyzer
    spec:
      containers:
        - name: presidio-analyzer-proxy
          # DIGEST_NOT_PINNED — run: task pin-images
          image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
          ports:
            - containerPort: 3000
          env:
            # Only render our own variables; nginx's $host etc. stay untouched.
            - name: NGINX_ENVSUBST_FILTER
              value: "^RUNPOD_"
            - name: RUNPOD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runpod-analyzer
                  key: RUNPOD_API_KEY
            - name: RUNPOD_ENDPOINT_ID
              valueFrom:
                secretKeyRef:
                  name: runpod-analyzer
                  key: RUNPOD_ENDPOINT_ID
          volumeMounts:
            - name: templates
              mountPath: /etc/nginx/templates
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
      volumes:
        - name: templates
          configMap:
            name: presidio-analyzer-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-analyzer
  namespace: gateway
spec:
  selector:
    app: presidio-analyzer
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
