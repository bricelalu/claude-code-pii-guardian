apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-anthropic-script
  namespace: gateway
data:
  server.py: |
    import json, sqlite3, http.server, socketserver

    DB_PATH = "/data/leaked_customers.db"
    PORT = 8081

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_POST(self):
            if self.path != "/v1/chat/completions":
                self.send_response(404)
                self.end_headers()
                return
            content_length = int(self.headers.get("Content-Length", 0))
            self.rfile.read(content_length)
            conn = sqlite3.connect(DB_PATH)
            conn.row_factory = sqlite3.Row
            rows = [dict(r) for r in conn.execute("SELECT * FROM customers_leaked").fetchall()]
            conn.close()
            resp = {
                "id": "chatcmpl-mock-001",
                "object": "chat.completion",
                "created": 1790607233,
                "model": "claude-sonnet-5",
                "choices": [{"index": 0, "message": {"role": "assistant", "content": json.dumps(rows, indent=2)}, "finish_reason": "stop"}],
                "usage": {"prompt_tokens": 100, "completion_tokens": 1000, "total_tokens": 1100}
            }
            body = json.dumps(resp).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *args): pass

    with socketserver.TCPServer(("", PORT), Handler) as httpd:
        print(f"Mock server on {PORT}")
        httpd.serve_forever()
---
apiVersion: v1
kind: Pod
metadata:
  name: mock-anthropic
  namespace: gateway
  labels:
    app: mock-anthropic
spec:
  containers:
  - name: mock
    image: python:3.14-slim
    command: ["python3", "/server/server.py"]
    ports:
    - containerPort: 8081
    volumeMounts:
    - name: script
      mountPath: /server
    - name: data
      mountPath: /data
  volumes:
  - name: script
    configMap:
      name: mock-anthropic-script
  - name: data
    emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-anthropic
  namespace: gateway
spec:
  selector:
    app: mock-anthropic
  ports:
  - port: 8081
    targetPort: 8081
