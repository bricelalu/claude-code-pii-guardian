apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: gateway
data:
  config.yaml: |
    # Claude Code resolves its aliases client-side and sends the full model ID
    # (verified: "/model sonnet" and "claude-sonnet-5[1m]" both arrive here as
    # "claude-sonnet-5" — the "[1m]" suffix is stripped before the request is
    # sent). So these bare IDs are what the gateway actually has to serve.
    # The 1M context window is a client-side setting, not a gateway one.
    model_list:
      - model_name: "claude-sonnet-5"
        litellm_params:
          model: "anthropic/claude-sonnet-5"
      - model_name: "claude-opus-5"
        litellm_params:
          model: "anthropic/claude-opus-5"
      - model_name: "claude-fable-5-1"
        litellm_params:
          model: "anthropic/claude-fable-5-1"
      - model_name: "claude-haiku-4-5-20251001"
        litellm_params:
          model: "anthropic/claude-haiku-4-5-20251001"

    router_settings:
      # Short aliases for clients that send them literally (curl, SDKs).
      # Claude Code itself never sends these — it resolves them first.
      model_group_alias:
        "sonnet": "claude-sonnet-5"
        "opus": "claude-opus-5"
        "haiku": "claude-haiku-4-5-20251001"
        "fable": "claude-fable-5-1"

    guardrails:
      # One guardrail for Claude Code traffic: guardrail/code_guard.py (mounted next to this file).
      # Masks user text and tool results only; never the system prompt, assistant text,
      # tool_use input, Write/Edit results, paths or URLs. See the module docstring.
      - guardrail_name: "code-guard"
        litellm_params:
          guardrail: code_guard.CodeGuard
          mode: "pre_call"
          default_on: true
          # Names and places (NER), via Presidio + GLiNER2 on RunPod. Cutoffs from
          # docs/ner-model-benchmark.md (100% precision on code, held-out languages): code tokens
          # such as `fullName` score up to 0.81 and cloud regions (`us-east-1a`) up to 0.95.
          # Credit cards (Luhn-checked by Presidio) are masked as <CREDIT_CARD>, not blocked: a blocked
          # value stays in the history Claude Code resends every turn, so one test card in a tool
          # result would fail every later request until /clear. block_entities is left empty.
          ner_thresholds:
            PERSON: 0.85
            LOCATION: 0.96
            CREDIT_CARD: 0.6
          block_entities: []
          # Their tool_result echoes the file being edited; masking it breaks the next Edit.
          skip_tools: ["Write", "Edit", "MultiEdit", "NotebookEdit"]
          # Read results of code files are not masked (pygments recognizes the language, e.g.
          # .py .ts .go .tf Dockerfile): Claude quotes them exactly in its Edits. These extensions stay
          # masked anyway (exports, dumps); unknown files (.env, no extension) are masked too.
          # MCP, Bash and Grep results are always masked.
          data_extensions: [".csv", ".tsv", ".json", ".jsonl", ".ndjson", ".md", ".markdown", ".txt", ".log", ".xml", ".sql"]
          # Deterministic PII (email, IPv4/6, phones, IBAN): REGEXES in guardrail/code_guard.py,
          # where they are unit-tested against real code false positives.

      # Second pass over the same blocks code-guard masks, finishing what it left partial.
      # guardrail/leak_guard_hook.py (mounted next to this file) is a thin LiteLLM adapter;
      # guardrail/leak_guard.py holds the engine and stays free of any LiteLLM import.
      #
      # ORDER IS LOAD-BEARING: leak-guard must stay listed after code-guard. LeakGuard
      # completes a column only from a masking token that is already in it, so running
      # first it has nothing to key on and silently completes nothing.
      #
      # It only acts on a document that already carries tokens, so it is a no-op on a
      # request code-guard fully handled. It shares code_guard's target walk (data_targets)
      # rather than defining its own idea of a data file — two definitions is how a second
      # layer ends up rewriting a .py file Claude is editing.
      - guardrail_name: "leak-guard"
        litellm_params:
          guardrail: leak_guard_hook.LeakGuardHook
          mode: "pre_call"
          default_on: true

      # Disabled for now: logging_only Presidio pass (DATE_TIME and low-score detections).
      # - guardrail_name: "presidio-audit"
      #   litellm_params:
      #     guardrail: presidio
      #     mode: "logging_only"
      #     default_on: true
      #     presidio_language: "en"
      #     presidio_score_thresholds:
      #       ALL: 0.35
      #     pii_entities_config:
      #       EMAIL_ADDRESS: "MASK"
      #       PERSON: "MASK"
      #       PHONE_NUMBER: "MASK"
      #       LOCATION: "MASK"
      #       DATE_TIME: "MASK"

    litellm_settings:
      forward_llm_provider_auth_headers: true
      set_verbose: true
      json_logs: true
      drop_params: true
      disable_extended_context_check: true  # Add this

    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      # Claude Code on a Max plan authenticates with an OAuth bearer, not an API key, and
      # expects the proxy to pass that Authorization header straight through to Anthropic.
      # Harmless with a real key, required for the OAuth path.
      # https://docs.litellm.ai/docs/tutorials/claude_code_max_subscription
      forward_client_headers_to_llm_api: true
      # Persist the request body in LiteLLM_SpendLogs. Off by default, and with it off the
      # `messages` and `proxy_server_request` columns are NULL — so there is no record of
      # what the guardrails actually sent upstream, and the only way to check that masking
      # worked is to ask the model, which is exactly what cannot be trusted.
      #
      # It must live in general_settings, NOT litellm_settings: only general_settings is
      # fed to that startup handler (proxy_server.py ~L7088), so the key under
      # litellm_settings is accepted and then never read.
      #
      # This is a POC on a laptop with synthetic fixtures, so storing bodies is a
      # deliberate trade: it makes the masking auditable. Turn it off anywhere real.
      # The ground-truth check is scripts/e2e_export.py --check-logs-only.
      store_prompts_in_spend_logs: true
