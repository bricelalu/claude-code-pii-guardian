apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: gateway
data:
  config.yaml: |
    # Claude Code resolves its aliases client-side and sends the full model ID
    # (verified: "/model sonnet" and "claude-sonnet-5[1m]" both arrive here as
    # "claude-sonnet-5" — the "[1m]" suffix is stripped before the request is
    # sent). So these bare IDs are what the gateway actually has to serve.
    # The 1M context window is a client-side setting, not a gateway one.
    model_list:
      - model_name: "claude-sonnet-5"
        litellm_params:
          model: "anthropic/claude-sonnet-5"
      - model_name: "claude-opus-5"
        litellm_params:
          model: "anthropic/claude-opus-5"
      - model_name: "claude-fable-5-1"
        litellm_params:
          model: "anthropic/claude-fable-5-1"
      - model_name: "claude-haiku-4-5-20251001"
        litellm_params:
          model: "anthropic/claude-haiku-4-5-20251001"

    router_settings:
      # Short aliases for clients that send them literally (curl, SDKs).
      # Claude Code itself never sends these — it resolves them first.
      model_group_alias:
        "sonnet": "claude-sonnet-5"
        "opus": "claude-opus-5"
        "haiku": "claude-haiku-4-5-20251001"
        "fable": "claude-fable-5-1"

    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"

    guardrails:
      - guardrail_name: "presidio-mask"
        litellm_params:
          guardrail: presidio
          mode: "pre_call"
          default_on: true
          presidio_language: "en"
          # PERSON/LOCATION come from GLiNER2; cutoffs from docs/ner-model-benchmark.md
          # (100% precision on code, held-out languages). Code tokens such as
          # `fullName` score up to 0.81 and cloud regions (`us-east-1a`) up to 0.95.
          presidio_score_thresholds:
            ALL: 0.6
            PERSON: 0.85
            LOCATION: 0.96
          pii_entities_config:
            EMAIL_ADDRESS: "MASK"
            PERSON: "MASK"
            LOCATION: "MASK"
            PHONE_NUMBER: "MASK"
            CREDIT_CARD: "BLOCK"
            IBAN_CODE: "BLOCK"

      - guardrail_name: "presidio-audit"
        litellm_params:
          guardrail: presidio
          mode: "logging_only"
          default_on: true
          presidio_language: "en"
          presidio_score_thresholds:
            ALL: 0.35
          pii_entities_config:
            EMAIL_ADDRESS: "MASK"
            PERSON: "MASK"
            PHONE_NUMBER: "MASK"
            LOCATION: "MASK"
            DATE_TIME: "MASK"

    litellm_settings:
      forward_llm_provider_auth_headers: true
      set_verbose: true
      json_logs: true
      drop_params: true
      disable_extended_context_check: true  # Add this
